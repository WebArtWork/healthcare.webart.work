<header class="uikit-topbar">
	<button
		type="button"
		class="uikit-topbar__menu-toggle"
		aria-label="Toggle navigation"
		(click)="menuToggle.emit()"
	>
		<i class="pi pi-bars"></i>
	</button>

	<span class="uikit-topbar__title">NGX Prime Default UI Kit</span>

	<div class="uikit-topbar__actions">
		<p-button
			icon="pi pi-palette"
			[text]="true"
			[rounded]="true"
			ariaLabel="Design Lab"
			pTooltip="Design Lab"
			tooltipPosition="bottom"
			(onClick)="goToDesignLab()"
		/>

		<p-button
			icon="pi pi-download"
			[text]="true"
			[rounded]="true"
			[disabled]="!designLabState.hasChanges()"
			ariaLabel="Download changed theme config as JSON"
			pTooltip="Download Config"
			tooltipPosition="bottom"
			(onClick)="downloadConfig()"
		/>

		<p-button
			[icon]="designLabState.dark() ? 'pi pi-sun' : 'pi pi-moon'"
			[text]="true"
			[rounded]="true"
			[ariaLabel]="designLabState.dark() ? 'Switch to light mode' : 'Switch to dark mode'"
			(onClick)="designLabState.toggleDarkMode()"
		/>
	</div>
</header>
