<article class="short">
	<img class="short__thumb" [src]="entity.logo || '/default-network.png'" [alt]="entity.name" loading="lazy" />

	<div class="short__body">
		<h3 class="short__title">{{ entity.name }}</h3>
		<p class="short__address">{{ entity.city }}, {{ entity.country }}</p>
	</div>
</article>
