<article class="short">
	<img
		class="short__thumb"
		[src]="photo"
		[alt]="entity.fullName"
		loading="lazy"
		(error)="onPhotoError($event)"
	/>

	<div class="short__body">
		<h3 class="short__title">{{ entity.fullName }} · {{ entity.category }}</h3>
		<p class="short__address">{{ entity.address }}</p>

		<div class="short__meta">
			<span>{{ entity.status }}</span>
			<span>{{ entity.vitals.ageYears }} р.</span>
			@if (entity.vitals.bedNumber) {
				<span>Ліжко {{ entity.vitals.bedNumber }}</span>
			}
		</div>
	</div>
</article>
