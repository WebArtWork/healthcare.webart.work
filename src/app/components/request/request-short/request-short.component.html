<article class="short">
	<div class="short__body">
		<h3 class="short__title">{{ entity.transactionType }} · {{ entity.city }}</h3>
		<span class="short__meta">{{ entity.region }}, {{ entity.country }}</span>
		<span class="short__price">{{ entity.minPrice }} - {{ entity.maxPrice }} {{ entity.currency }}</span>
	</div>
</article>
