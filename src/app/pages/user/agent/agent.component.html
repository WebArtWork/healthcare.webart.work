<section class="agent">

	@if (entity(); as item) {
	<div class="agent__actions">
		<button pButton type="button" severity="secondary" size="small" (click)="share()">
			<i class="pi pi-share-alt"></i>
			{{ translateService.translate('Поділитися')() }}
		</button>
	</div>
	<app-agent-view [entity]="item" />
	} @else {
	<p-card class="agent__not-found">
		<p>Агента не знайдено.</p>
	</p-card>
	}
</section>
