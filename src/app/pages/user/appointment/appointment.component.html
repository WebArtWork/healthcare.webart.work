<section class="appointment">

	@if (entity(); as item) {
	@let rel = relations();
	<app-appointment-view
		[entity]="item"
		[patient]="rel?.patient"
		[facility]="rel?.facility"
		[network]="rel?.network"
		[department]="rel?.department"
		[doctor]="rel?.doctor"
	/>
	} @else {
	<p-card class="appointment__not-found">
		<p translate>Запис на прийом не знайдено.</p>
	</p-card>
	}
</section>
