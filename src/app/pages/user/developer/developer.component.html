<section class="developer">

	@if (entity(); as item) {
	<div class="developer__actions">
		<button pButton type="button" severity="secondary" size="small" (click)="share()">
			<i class="pi pi-share-alt"></i>
			{{ translateService.translate('Поділитися')() }}
		</button>
	</div>
	<app-developer-view [entity]="item" />
	} @else {
	<p-card class="developer__not-found">
		<p>Забудовника не знайдено.</p>
	</p-card>
	}
</section>
