<section class="editor">
	<p-card header="Редактор">
		<div class="editor__picker">
			<p-selectbutton
				[options]="options"
				optionLabel="label"
				optionValue="value"
				[ngModel]="selectedType()"
				(ngModelChange)="selectedType.set($event)"
			/>
		</div>

		@switch (selectedType()) {
			@case ('patient') {
				<app-patient-form />
			}
			@case ('appointment') {
				<app-appointment-form />
			}
			@case ('record') {
				<app-record-form />
			}
			@case ('facility') {
				<app-facility-form />
			}
			@case ('network') {
				<app-network-form />
			}
			@case ('department') {
				<app-department-form />
			}
			@case ('doctor') {
				<app-doctor-form />
			}
		}

		<div class="editor__actions">
			<button pButton type="button" (click)="wValidate()"><span translate>Перевірити</span></button>
		</div>
	</p-card>
</section>
