<div class="explore">
	<div class="explore__header">
		<h1 class="explore__title">Пошук</h1>

		<input
			pInputText
			type="text"
			placeholder="Адреса, місто або назва прийому"
			class="explore__search"
			[ngModel]="searchTerm()"
			(ngModelChange)="searchTerm.set($event)"
		/>

		<p-multiSelect
			appendTo="body"
			scrollHeight="auto"
			[options]="patientCategoryOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Категорія пацієнта"
			class="explore__filter"
			[ngModel]="selectedPatientCategories()"
			(ngModelChange)="selectedPatientCategories.set($event)"
		/>

		<p-select
			appendTo="body"
			scrollHeight="auto"
			[options]="appointmentTypeOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Тип прийому"
			[showClear]="true"
			class="explore__filter"
			[ngModel]="selectedAppointmentType()"
			(ngModelChange)="selectedAppointmentType.set($event)"
		/>

		<p-select
			appendTo="body"
			scrollHeight="auto"
			[options]="appointmentStatusOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Статус"
			[showClear]="true"
			class="explore__filter"
			[ngModel]="selectedStatus()"
			(ngModelChange)="selectedStatus.set($event)"
		/>

		<a pButton routerLink="/map" severity="secondary" size="small" class="explore__map-link">Карта</a>
	</div>

	<div class="explore__grid">
		@for (row of results(); track row.appointment._id) {
		<div class="explore__row" (click)="view(row.appointment)">
			<app-appointment-short
				[entity]="row.appointment"
				[doctor]="row.relations.doctor"
				[department]="row.relations.department"
				[network]="row.relations.network"
				[facility]="row.relations.facility"
				(relationClick)="viewRelation($event)"
			/>
		</div>
		} @empty {
		<p class="explore__empty">За заданими критеріями записів на прийом не знайдено.</p>
		}
	</div>
</div>
