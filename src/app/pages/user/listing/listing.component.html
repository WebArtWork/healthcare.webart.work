<section class="listing">

	@if (entity(); as item) {
	@let rel = relations();
	<app-listing-view
		[entity]="item"
		[patient]="rel?.patient"
		[facility]="rel?.facility"
		[network]="rel?.network"
		[department]="rel?.department"
		[doctor]="rel?.doctor"
	/>
	} @else {
	<p-card class="listing__not-found">
		<p>Оголошення не знайдено.</p>
	</p-card>
	}
</section>
