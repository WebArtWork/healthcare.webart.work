<section class="patient">

	@if (entity(); as item) {
	@let rel = relations();
	<app-patient-view
		[entity]="item"
		[facility]="rel?.facility"
		[network]="rel?.network"
		[department]="rel?.department"
		[doctor]="rel?.doctor"
		[listings]="rel?.listings ?? []"
		[records]="rel?.records ?? []"
		[comments]="rel?.comments ?? []"
	/>
	} @else {
	<p-card class="patient__not-found">
		<p>Пацієнта не знайдено.</p>
	</p-card>
	}
</section>
